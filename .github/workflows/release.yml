name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to bump and release (e.g. 0.1.1)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Determine version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            INPUT_VERSION="${{ inputs.version }}"
            VERSION="${INPUT_VERSION#v}"
            npm version "$VERSION" --no-git-tag-version
            bun install
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json bun.lock
            git commit -m "chore: bump version to ${VERSION}"
            git push origin "HEAD:${{ github.ref_name }}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          TAG="v${VERSION}"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Build static export
        run: bun run build

      - name: Package static archive
        run: |
          tar -czf site.tar.gz -C out .
          sha256sum site.tar.gz > site.tar.gz.sha256

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" site.tar.gz site.tar.gz.sha256 --clobber
          else
            gh release create "${TAG}" site.tar.gz site.tar.gz.sha256 --title "${TAG}" --generate-notes
          fi
